<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Shelf</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <p class="eyebrow">Continuous Assurance example</p>
    <h1>Reading Shelf</h1>
    <p class="lede">Save articles to read later, leave yourself a note, and keep track of what you’ve started.</p>
  </header>

  <main class="layout">
    <section class="panel add-panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add an article</h2>
      <form id="add-form" novalidate>
        <label for="add-title">Title</label>
        <input id="add-title" name="title" type="text" autocomplete="off" maxlength="300" required>
        <label for="add-url">Link</label>
        <input id="add-url" name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://" required>
        <button type="submit" class="primary">Save article</button>
        <p id="add-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel library-panel" aria-labelledby="library-heading">
      <div class="library-header">
        <h2 id="library-heading">In the library</h2>
        <p id="library-count" class="count"></p>
      </div>
      <p id="library-message" class="message" role="status" aria-live="polite"></p>
      <ol id="article-list" class="article-list"></ol>
      <p id="empty-library" class="empty" hidden>Nothing saved yet. Add an article to start your library.</p>
    </section>
  </main>

  <template id="article-template">
    <li class="article">
      <div class="article-heading">
        <a class="article-title" target="_blank" rel="noopener noreferrer"><span class="title-text"></span><span class="external" aria-hidden="true"> ↗</span></a>
        <p class="article-host"></p>
      </div>
      <fieldset class="status-picker">
        <legend>Reading status</legend>
        <button type="button" data-status="to_read">To read</button>
        <button type="button" data-status="reading">Reading</button>
        <button type="button" data-status="read">Read</button>
      </fieldset>
      <div class="note-editor">
        <label class="note-label">Note</label>
        <textarea class="note" rows="2" maxlength="10000" placeholder="Why did you save this?"></textarea>
        <div class="note-actions">
          <button type="button" class="save-note">Save note</button>
          <span class="note-message message" role="status" aria-live="polite"></span>
        </div>
      </div>
    </li>
  </template>
</body>
</html>
