<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Shelf</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <p class="eyebrow">Continuous Assurance example</p>
    <h1>Reading Shelf</h1>
    <p class="lede">Save articles to read later, leave yourself a note, and keep track of what you’ve started.</p>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel add-panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add an article</h2>
        <form id="add-form" novalidate>
          <label for="add-title">Title</label>
          <input id="add-title" name="title" type="text" autocomplete="off" maxlength="300" required>
          <label for="add-url">Link</label>
          <input id="add-url" name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://" required>
          <button type="submit" class="primary">Save article</button>
          <p id="add-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <nav class="panel collections-panel" aria-labelledby="collections-heading">
        <h2 id="collections-heading">Collections</h2>
        <ul id="view-list" class="view-list"></ul>
        <form id="collection-form" class="collection-form" novalidate>
          <label for="collection-name">New collection</label>
          <div class="inline-field">
            <input id="collection-name" name="name" type="text" autocomplete="off" maxlength="80" placeholder="e.g. Weekend reading">
            <button type="submit">Create</button>
          </div>
          <p id="collection-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </nav>
    </aside>

    <section class="panel library-panel" aria-labelledby="view-heading">
      <div class="library-header">
        <div>
          <p class="view-kind" id="view-kind">Library</p>
          <h2 id="view-heading" class="view-heading">All articles</h2>
        </div>
        <p id="library-count" class="count"></p>
      </div>
      <div class="status-filter" role="group" aria-label="Show articles by reading status">
        <button type="button" data-filter="">All</button>
        <button type="button" data-filter="to_read">To read</button>
        <button type="button" data-filter="reading">Reading</button>
        <button type="button" data-filter="read">Read</button>
      </div>
      <p id="library-message" class="message" role="status" aria-live="polite"></p>
      <ol id="article-list" class="article-list"></ol>
      <p id="empty-library" class="empty" hidden></p>
    </section>
  </main>

  <template id="article-template">
    <li class="article">
      <div class="article-heading">
        <div>
          <a class="article-title" target="_blank" rel="noopener noreferrer"><span class="title-text"></span><span class="external" aria-hidden="true"> ↗</span></a>
          <p class="article-host"></p>
        </div>
        <button type="button" class="archive-button">Archive</button>
      </div>
      <fieldset class="status-picker">
        <legend>Reading status</legend>
        <button type="button" data-status="to_read">To read</button>
        <button type="button" data-status="reading">Reading</button>
        <button type="button" data-status="read">Read</button>
      </fieldset>
      <div class="note-editor">
        <label class="note-label">Note</label>
        <textarea class="note" rows="2" maxlength="10000" placeholder="Why did you save this?"></textarea>
        <div class="note-actions">
          <button type="button" class="save-note">Save note</button>
          <span class="note-message message" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="memberships">
        <span class="memberships-label">Collections</span>
        <ul class="chips"></ul>
        <select class="add-to-collection" aria-label="Add to a collection"></select>
      </div>
    </li>
  </template>

  <template id="archived-template">
    <li class="article archived">
      <div class="article-heading">
        <div>
          <a class="article-title" target="_blank" rel="noopener noreferrer"><span class="title-text"></span><span class="external" aria-hidden="true"> ↗</span></a>
          <p class="article-host"></p>
        </div>
        <button type="button" class="restore-button primary-outline">Restore</button>
      </div>
      <dl class="archived-details">
        <dt>Reading status</dt>
        <dd class="archived-status"></dd>
        <dt>Note</dt>
        <dd class="archived-note"></dd>
        <dt>Returns to</dt>
        <dd class="archived-returns"></dd>
        <dt>Archived</dt>
        <dd class="archived-when"></dd>
      </dl>
      <p class="restore-message message" role="status" aria-live="polite"></p>
    </li>
  </template>
</body>
</html>
