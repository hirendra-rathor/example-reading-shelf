<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Shelf</title>
  <link rel="stylesheet" href="/static/library.css">
  <script src="/static/library.js" defer></script>
</head>
<body>
  <header class="masthead"><div class="wrap"><p class="eyebrow">A LITTLE SPACE FOR GOOD READING</p><h1>Reading Shelf</h1><p class="intro">Keep the links. Remember the thought. Pick up where you left off.</p></div></header>
  <main class="wrap">
    <section class="capture panel" aria-labelledby="capture-heading">
      <div><p class="eyebrow">SAVE SOMETHING GOOD</p><h2 id="capture-heading">Your next read</h2></div>
      <form id="capture-form">
        <label>Article title<input name="title" required maxlength="200" placeholder="A title worth remembering" autocomplete="off"></label>
        <label>Original link<input name="url" type="url" required maxlength="4096" placeholder="https://…"></label>
        <button type="submit">Save article</button>
      </form>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="library-heading">
      <div class="section-heading"><div><p class="eyebrow">MAKE TIME TO COME BACK</p><h2 id="library-heading">Your library <span id="count"></span></h2></div><button id="refresh" class="secondary" type="button">Refresh</button></div>
      <div id="articles" class="articles"></div>
      <p id="empty" class="empty" hidden>No articles yet. Save a link above to begin your shelf.</p>
    </section>
  </main>
  <footer class="wrap">A personal reading library · saved on this computer</footer>
  <template id="article-template">
    <article class="article panel">
      <div class="article-heading"><h3><a target="_blank" rel="noopener noreferrer"></a></h3><span class="status-badge"></span></div>
      <p class="article-url"></p>
      <form class="edit-form">
        <label>Your note<textarea name="note" rows="3" maxlength="10000" placeholder="Why did this catch your attention?"></textarea></label>
        <div class="edit-actions"><label>Reading status<select name="status"><option value="to_read">To read</option><option value="reading">Reading</option><option value="read">Read</option></select></label><div class="buttons"><button class="secondary" type="reset">Revert</button><button type="submit">Save changes</button></div></div>
        <p class="draft-hint" aria-live="polite"></p>
      </form>
    </article>
  </template>
</body>
</html>
