[project]
name = "reading-shelf"
version = "0.1.0"
description = "A personal reading library for the Continuous Assurance tutorial"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
