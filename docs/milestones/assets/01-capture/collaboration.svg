<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1160" viewBox="0 0 1740 1160" role="img"><title>01 · Capture and track reading · collaboration</title><desc>Baseline: starter · Proposed calls and durable effects; failures do not imply a completed write.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#40566a"/></marker></defs><rect width="100%" height="100%" fill="#f2f5f8"/><text x="30" y="44" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183047">01 · Capture and track reading · collaboration</text><text x="30" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4b6173">Baseline: starter · Proposed calls and durable effects; failures do not imply a completed write.</text><rect x="1430" y="20" width="88" height="26" rx="5" fill="#168459"/><text x="1439" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">new</text><rect x="1526" y="20" width="88" height="26" rx="5" fill="#2563eb"/><text x="1535" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><rect x="1622" y="20" width="88" height="26" rx="5" fill="#737d8b"/><text x="1631" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">context</text><rect x="570" y="115" width="1135" height="440" rx="15" fill="#eaf0f8" stroke="#9caebf" stroke-dasharray="7 5"/><text x="590" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4b6173">Reading Shelf server · Flask process + local SQLite file</text><rect x="30" y="180" width="500" height="330" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="442" y="180" width="88" height="24" rx="4" fill="#2563eb"/><text x="450" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><text x="44" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6173">Runtime unit · browser document</text><text x="44" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183047">Browser page</text><text x="44" y="260.6" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566777">Today: static placeholder.</text><text x="44" y="289.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Proposed: capture form, linked titles, editable</text><text x="44" y="313.20000000000005" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">note/status cards, and separate saved/draft state.</text><text x="44" y="342.00000000000006" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Calls the Flask service on the same origin.</text><text x="44" y="370.80000000000007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Renders user values with textContent.</text><rect x="610" y="180" width="500" height="330" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="1022" y="180" width="88" height="24" rx="4" fill="#2563eb"/><text x="1030" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><text x="624" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6173">Runtime unit · Python process</text><text x="624" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183047">Flask service</text><text x="624" y="260.6" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566777">Today: page route and startup probe.</text><text x="624" y="289.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Proposed: articles.py validates requests; db.py</text><text x="624" y="313.20000000000005" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">manages connections.</text><text x="624" y="342.00000000000006" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Validate every field before entering the write</text><text x="624" y="365.80000000000007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">transaction.</text><text x="624" y="394.6000000000001" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Return the committed record or a JSON error.</text><rect x="1190" y="180" width="500" height="330" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="1602" y="180" width="88" height="24" rx="4" fill="#2563eb"/><text x="1610" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><text x="1204" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6173">Persistence participant · local file</text><text x="1204" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183047">SQLite store</text><text x="1204" y="260.6" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566777">Today: opens an empty library file.</text><text x="1204" y="289.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Proposed: articles table with stable IDs and unique</text><text x="1204" y="313.20000000000005" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">URLs.</text><text x="1204" y="342.00000000000006" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Transactions commit or roll back as a unit.</text><text x="1204" y="370.80000000000007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Startup preserves existing tables and saved records.</text><path d="M530,300 L610,300" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="537" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">request</text><path d="M1110,300 L1190,300" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="1117" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">SQL</text><path d="M1190,440 L1110,440" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="1117" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">row / error</text><path d="M610,440 L530,440" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="537" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">JSON</text><text x="30" y="600" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047">One concrete operation, including its recovery boundary</text><rect x="30" y="635" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="660" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">1. Capture</text><text x="47" y="684" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Browser → POST title Focaccia + https://en.wikipedia.org/wiki/Focaccia → Flask validates → SQLite inserts article A.</text><rect x="30" y="711" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="736" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">2. Record progress</text><text x="47" y="760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Browser → PATCH A with note “Try rosemary” and status reading → commit → return A → update saved browser state.</text><rect x="30" y="787" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="812" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">3. Repeat capture</text><text x="47" y="836" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">POST the same URL again → unique URL selects A → return original title, note and status without overwriting them.</text><rect x="30" y="863" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="888" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">4. Restart and read</text><text x="47" y="912" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Stop Flask; start a fresh process on the same file → GET /api/articles → browser displays the same A and original link.</text><rect x="30" y="939" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="964" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">5. Reject / recover</text><text x="47" y="988" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Invalid status is rejected before SQL. A SQL abort rolls back. A transport error preserves the draft; Refresh rereads saved data.</text><rect x="30" y="1015" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="1040" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">6. Acceptance observation</text><text x="47" y="1064" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">A retains its ID, title, URL, note and reading status. UI interaction, API behavior and file persistence are separate checks.</text></svg>