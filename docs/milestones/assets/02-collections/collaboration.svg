<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1160" viewBox="0 0 1740 1160" role="img"><title>02 · Organize the library · collaboration</title><desc>Baseline: milestone 1 · Proposed calls and durable effects; failures do not imply a completed write.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#40566a"/></marker></defs><rect width="100%" height="100%" fill="#f2f5f8"/><text x="30" y="44" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183047">02 · Organize the library · collaboration</text><text x="30" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4b6173">Baseline: milestone 1 · Proposed calls and durable effects; failures do not imply a completed write.</text><rect x="1430" y="20" width="88" height="26" rx="5" fill="#168459"/><text x="1439" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">new</text><rect x="1526" y="20" width="88" height="26" rx="5" fill="#2563eb"/><text x="1535" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><rect x="1622" y="20" width="88" height="26" rx="5" fill="#737d8b"/><text x="1631" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">context</text><rect x="570" y="115" width="1135" height="440" rx="15" fill="#eaf0f8" stroke="#9caebf" stroke-dasharray="7 5"/><text x="590" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4b6173">Reading Shelf server · Flask process + local SQLite file</text><rect x="30" y="180" width="500" height="330" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="442" y="180" width="88" height="24" rx="4" fill="#2563eb"/><text x="450" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><text x="44" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6173">Runtime unit · browser document</text><text x="44" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183047">Browser page</text><text x="44" y="260.6" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566777">Today: whole-library cards and independent drafts.</text><text x="44" y="289.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Proposed: collection/status selectors, new</text><text x="44" y="313.20000000000005" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">collection form and membership controls.</text><text x="44" y="342.00000000000006" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Use the existing article ID for editing.</text><text x="44" y="370.80000000000007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Block navigation that would hide unsaved drafts.</text><rect x="610" y="180" width="500" height="330" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="1022" y="180" width="88" height="24" rx="4" fill="#2563eb"/><text x="1030" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><text x="624" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6173">Runtime unit · Python process</text><text x="624" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183047">Flask service</text><text x="624" y="260.6" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566777">Today: article capture/list/edit.</text><text x="624" y="289.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Proposed: collection catalog and idempotent</text><text x="624" y="313.20000000000005" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">membership routes.</text><text x="624" y="342.00000000000006" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Validate filter values and referenced entities.</text><text x="624" y="370.80000000000007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Compose one query for collection + status.</text><rect x="1190" y="180" width="500" height="330" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="1602" y="180" width="88" height="24" rx="4" fill="#2563eb"/><text x="1610" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">changed</text><text x="1204" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4b6173">Persistence participant · local file</text><text x="1204" y="229" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183047">SQLite store</text><text x="1204" y="260.6" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566777">Today: one articles table.</text><text x="1204" y="289.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Proposed: collections and collection_articles tables</text><text x="1204" y="313.20000000000005" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">added transactionally.</text><text x="1204" y="342.00000000000006" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Article note/status remain stored once.</text><text x="1204" y="370.80000000000007" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Composite primary key and foreign keys preserve</text><text x="1204" y="394.6000000000001" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">membership identity.</text><path d="M530,300 L610,300" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="537" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">request</text><path d="M1110,300 L1190,300" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="1117" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">SQL</text><path d="M1190,440 L1110,440" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="1117" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">row / error</text><path d="M610,440 L530,440" fill="none" stroke="#22a06b" stroke-width="2" marker-end="url(#arrow)"/><text x="537" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344a5e">JSON</text><text x="30" y="600" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183047">One concrete operation, including its recovery boundary</text><rect x="30" y="635" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="660" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">1. Create groups</text><text x="47" y="684" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Browser → POST Food and cooking and Weekend reading → Flask normalizes names → SQLite stores two collection IDs.</text><rect x="30" y="711" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="736" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">2. Attach the same article</text><text x="47" y="760" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">PUT (Food,A), then PUT (Weekend,A) → two membership pairs, one article A; repeating either PUT does not duplicate it.</text><rect x="30" y="787" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="812" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">3. Edit through Food</text><text x="47" y="836" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Select Food → PATCH A to “Bake Saturday” / reading → article row changes → select Weekend → same values are visible.</text><rect x="30" y="863" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="888" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">4. Apply the rule</text><text x="47" y="912" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Select Reading in Weekend → change A to Read through Food → next Reading query in either group excludes A.</text><rect x="30" y="939" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="964" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">5. Detach and recover</text><text x="47" y="988" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">DELETE (Food,A) leaves (Weekend,A) and A itself. Restart Flask: the note, status and remaining membership still exist.</text><rect x="30" y="1015" width="1660" height="65" rx="6" fill="#fff" stroke="#d6e0e8"/><text x="47" y="1040" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183047">6. Failure boundary</text><text x="47" y="1064" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183047">Validate every ID and filter before mutation; unsaved drafts block navigation. Failed writes roll back; failed reads can be retried.</text></svg>