<text x="346.5" y="155" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="56" y="174" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT · app.js</text>
<text x="56" y="200" font-size="19" font-weight="700" fill="#182f46" text-anchor="start">Library page</text>
<text x="56" y="228" font-size="14.5" font-weight="400" fill="#586674" text-anchor="start">Today: library and collections.</text>
<text x="56" y="248" font-size="14.5" font-weight="400" fill="#192e42" text-anchor="start">Proposed: Archive button per</text>
<text x="56" y="268" font-size="14.5" font-weight="400" fill="#192e42" text-anchor="start">card; Archive view with Restore.</text>
<text x="44" y="345" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">REQUESTS IN THE SCENARIO</text>
<text x="44" y="372.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">① Weekend reading view</text>
<text x="66" y="391.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">POST /api/articles/1/archive</text>
<text x="44" y="414.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">② Food and cooking view</text>
<text x="66" y="433.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">GET /api/collections/1/articles → [ ]</text>
<text x="44" y="456.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">③ Archive view</text>
<text x="66" y="475.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">GET /api/archive → Focaccia, ids [1, 2]</text>
<text x="44" y="498.0" font-size="13.5" font-weight="700" fill="#586674" text-anchor="start">— server restart —</text>
<text x="44" y="526.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">④ Archive view</text>
<text x="66" y="545.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">POST /api/articles/1/restore</text>
<text x="44" y="568.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">⑤ Both collections, Reading only</text>
<text x="66" y="587.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">GET /api/collections/{1,2}/articles?status=reading</text>
<text x="44" y="660.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">⑤ returns Focaccia in each collection with</text>
<text x="44" y="678.5" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">“Stopped at the shaping step.” and Reading;</text>
<text x="44" y="697.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">its title still links to the same URL.</text>
