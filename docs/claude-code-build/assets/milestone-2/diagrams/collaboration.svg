<text x="1350.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<rect x="1235" y="20" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="1270.0" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<rect x="24" y="100" width="390" height="730" rx="9" fill="#f3f6f9" stroke="#a7b4c2" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="40" y="124" font-size="13" font-weight="700" fill="#48617a" text-anchor="start">READER’S BROWSER</text>
