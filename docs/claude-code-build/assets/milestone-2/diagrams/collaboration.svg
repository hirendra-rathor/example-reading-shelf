<text x="346.5" y="155" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="56" y="174" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT · app.js</text>
<text x="56" y="200" font-size="19" font-weight="700" fill="#182f46" text-anchor="start">Library page</text>
<text x="56" y="228" font-size="14.5" font-weight="400" fill="#586674" text-anchor="start">Today: one library list.</text>
<text x="56" y="248" font-size="14.5" font-weight="400" fill="#192e42" text-anchor="start">Proposed: collection sidebar, status</text>
<text x="56" y="268" font-size="14.5" font-weight="400" fill="#192e42" text-anchor="start">filter, collection chips per card.</text>
<text x="44" y="345" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">REQUESTS IN THE SCENARIO</text>
<text x="44" y="372.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">① Food and cooking view</text>
<text x="66" y="391.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">PATCH /api/articles/1  {note}</text>
<text x="44" y="414.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">② Weekend reading view</text>
<text x="66" y="433.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">GET /api/collections/2/articles</text>
<text x="44" y="456.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">③ Weekend reading view</text>
<text x="66" y="475.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">PATCH /api/articles/1  {status: read}</text>
<text x="44" y="498.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">④ Food and cooking, Reading only</text>
<text x="66" y="517.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">GET /api/collections/1/articles?status=reading</text>
<text x="44" y="540.0" font-size="13.5" font-weight="700" fill="#192e42" text-anchor="start">⑤ Food and cooking view</text>
<text x="66" y="559.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">DELETE /api/collections/1/articles/1</text>
<text x="44" y="615.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">④ returns no articles: Focaccia’s status</text>
<text x="44" y="633.5" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">is read on its one row, not per collection.</text>
<text x="44" y="652.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start"></text>
<text x="44" y="670.5" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">After ⑤ Focaccia is still listed in</text>
<text x="44" y="689.0" font-size="13.5" font-weight="400" fill="#192e42" text-anchor="start">Weekend reading and in the library.</text>
